services:

  db:
    image: postgres:16
    container_name: campus_complaint_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: campus_complaint_portal

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_complaint_portal"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: .
    container_name: campus_complaint_backend

    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/campus_complaint_portal
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000


volumes:
  postgres_data: